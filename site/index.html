<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="FjeRDdsO6FIEmIHNYNxKb2">
<head data-page-node-id="ztI9ERzmX2SLLiOHOR799T">
  <meta charset="UTF-8" data-page-node-id="8ctArKGmc7DlZx2mEqJoev" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="4qu7JzX3vJxWAF46NqOCN1" />
  <title>Cloudflare Demo Site · WorkBuddy</title>
  <style>
    :root { --bg:#0b1020; --card:#141b2e; --accent:#f6821f; --text:#e6e9f0; --muted:#9aa3b2; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background:radial-gradient(1200px 600px at 70% -10%, #1b2540 0%, var(--bg) 60%); color:var(--text); display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:var(--card); border:1px solid #232c44; border-radius:16px; padding:32px; max-width:560px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.4); }
    h1 { margin:0 0 4px; font-size:24px; }
    .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
    .badge { display:inline-block; background:rgba(246,130,31,.15); color:var(--accent); border:1px solid rgba(246,130,31,.4); padding:4px 10px; border-radius:999px; font-size:12px; margin-bottom:18px; }
    pre { background:#0c1222; border:1px solid #232c44; border-radius:10px; padding:14px; overflow:auto; font-size:13px; color:#b9f5c8; max-height:240px; }
    button { background:var(--accent); color:#1a1205; border:0; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .api-url { color:var(--muted); font-size:12px; margin-top:14px; word-break:break-all; }
  </style>
</head>
<body data-page-node-id="p0dgRosQC0dxhOp84lBMVw">
  <div class="card" data-page-node-id="2AFDqsSjZEZqcA15QQDnRa">
    <span class="badge" data-page-node-id="XhE31Z0O1hiBjq1Jw0KFdn">⛅ Powered by Cloudflare Pages + Workers</span>
    <h1 data-page-node-id="Xc81Tty56E1QzJT1ZmT1Hc">你好,这是部署在 Cloudflare 上的静态站点</h1>
    <p class="sub" data-page-node-id="HSxNlqyFFOiayDdaRl6C9S">由 WorkBuddy 通过 wrangler 一键部署。下面的数据来自同一个账户里的 Worker(前后端打通)。</p>
    <button id="btn" onclick="loadData()" data-page-node-id="LwbA2gAyPiPVGHILOtgOM5">调用后端 API ↓</button>
    <pre id="out" data-page-node-id="OlNV6wiARzmYec7ow0oU5W">点击按钮,从 wb-demo-api Worker 拉取数据…</pre>
    <p class="api-url" data-page-node-id="Z0BEBfEPAcHBhr796HZ9TL">后端:https://wb-demo-api.wb-jialu1997-9q2.workers.dev</p>
  </div>
  <script>
    async function loadData() {
      const btn = document.getElementById('btn');
      const out = document.getElementById('out');
      btn.disabled = true; out.textContent = '请求中…';
      try {
        const r = await fetch('https://wb-demo-api.wb-jialu1997-9q2.workers.dev');
        const j = await r.json();
        out.textContent = JSON.stringify(j, null, 2);
      } catch (e) {
        out.textContent = '请求失败: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
